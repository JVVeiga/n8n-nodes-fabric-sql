<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Fabric SQL">
	<defs>
		<linearGradient id="fabricSqlTop" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#4ad4c8" />
			<stop offset="1" stop-color="#1aa9c6" />
		</linearGradient>
		<linearGradient id="fabricSqlMid" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#2fa7d8" />
			<stop offset="1" stop-color="#1e6fb8" />
		</linearGradient>
		<linearGradient id="fabricSqlBase" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#215fa8" />
			<stop offset="1" stop-color="#143d78" />
		</linearGradient>
	</defs>

	<!-- three stacked data layers: lakehouse -> analytics endpoint -> query -->
	<path d="M32 4 58 15 32 26 6 15Z" fill="url(#fabricSqlTop)" />
	<path d="M32 22 58 33 32 44 6 33Z" fill="url(#fabricSqlMid)" opacity="0.95" />
	<path d="M32 40 58 51 32 62 6 51Z" fill="url(#fabricSqlBase)" opacity="0.95" />

	<!-- query caret -->
	<path
		d="M25 46.5 31.5 51 25 55.5"
		fill="none"
		stroke="#ffffff"
		stroke-width="2.6"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<path d="M35 55.5h6" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />
</svg>
