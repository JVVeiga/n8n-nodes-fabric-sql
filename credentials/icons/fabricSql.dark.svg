<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Fabric SQL">
	<defs>
		<linearGradient id="fabricSqlDarkTop" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#7ff0e4" />
			<stop offset="1" stop-color="#3ac6e2" />
		</linearGradient>
		<linearGradient id="fabricSqlDarkMid" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#5cc4ef" />
			<stop offset="1" stop-color="#3f92d8" />
		</linearGradient>
		<linearGradient id="fabricSqlDarkBase" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#4b86cf" />
			<stop offset="1" stop-color="#2f5fa0" />
		</linearGradient>
	</defs>

	<!-- Same mark as the light variant, lifted a few stops so it stays legible on a dark ground -->
	<path d="M32 4 58 15 32 26 6 15Z" fill="url(#fabricSqlDarkTop)" />
	<path d="M32 22 58 33 32 44 6 33Z" fill="url(#fabricSqlDarkMid)" opacity="0.95" />
	<path d="M32 40 58 51 32 62 6 51Z" fill="url(#fabricSqlDarkBase)" opacity="0.95" />

	<!-- query caret -->
	<path
		d="M25 46.5 31.5 51 25 55.5"
		fill="none"
		stroke="#0b1a2b"
		stroke-width="2.6"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<path d="M35 55.5h6" fill="none" stroke="#0b1a2b" stroke-width="2.6" stroke-linecap="round" />
</svg>
